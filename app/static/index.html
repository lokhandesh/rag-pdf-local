<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF RAG</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --accent:#2f5d50; --accent-ink:#fff; --hit:#f0f4f2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161716; --card:#1f201f; --ink:#ececea; --muted:#9a9a94; --line:#333431; --accent:#7fb8a4; --accent-ink:#0e1a16; --hit:#232a27; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:4px 10px; font-weight:400; font-size:13px; }
  ul.docs { list-style:none; padding:0; margin:12px 0 0; } ul.docs li { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:14px; }
  .answer { white-space:pre-wrap; margin:14px 0 0; }
  .hit { background:var(--hit); border-radius:8px; padding:10px 12px; margin-top:8px; font-size:13px; }
  .hit b { font-weight:600; } .meta { color:var(--muted); font-size:12px; }
  .status { color:var(--muted); font-size:13px; margin-top:8px; min-height:1em; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>PDF RAG</h1>
  <p class="sub" id="health">Checking service…</p>

  <section class="card">
    <h2>Documents</h2>
    <div class="row">
      <input type="file" id="file" accept="application/pdf" multiple>
      <button id="uploadBtn">Upload &amp; ingest</button>
    </div>
    <div class="status" id="uploadStatus"></div>
    <ul class="docs" id="docs"></ul>
  </section>

  <section class="card">
    <h2>Ask</h2>
    <form class="row" id="askForm">
      <input type="text" id="q" placeholder="Ask something about your PDFs…" autocomplete="off">
      <button id="askBtn">Ask</button>
    </form>
    <div class="answer" id="answer"></div>
    <div id="sources"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function refresh() {
  try {
    const h = await (await fetch('/health')).json();
    $('health').textContent = `${h.chunks} chunks indexed · embeddings: ${h.embedding_backend} · LLM: ${h.llm_provider}`;
    const d = (await (await fetch('/documents')).json()).documents;
    $('docs').innerHTML = Object.entries(d).map(([n, c]) =>
      `<li><span>${esc(n)} <span class="meta">· ${c} chunks</span></span><button class="ghost" data-del="${esc(n)}">Remove</button></li>`).join('')
      || '<li class="meta">No documents yet. Upload a PDF to start.</li>';
  } catch { $('health').textContent = 'Service not reachable.'; }
}

$('docs').addEventListener('click', async e => {
  const n = e.target.dataset.del; if (!n) return;
  await fetch('/documents/' + encodeURIComponent(n), {method:'DELETE'}); refresh();
});

$('uploadBtn').onclick = async () => {
  const files = [...$('file').files]; if (!files.length) return;
  $('uploadBtn').disabled = true;
  for (const f of files) {
    $('uploadStatus').textContent = `Ingesting ${f.name}…`;
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch('/upload', {method:'POST', body:fd}); const j = await r.json();
    $('uploadStatus').textContent = r.ok ? `${j.source}: ${j.pages} pages → ${j.chunks} chunks${j.warning ? ' (' + j.warning + ')' : ''}` : `Error: ${j.detail}`;
  }
  $('uploadBtn').disabled = false; $('file').value = ''; refresh();
};

$('askForm').onsubmit = async e => {
  e.preventDefault(); const q = $('q').value.trim(); if (!q) return;
  $('askBtn').disabled = true; $('answer').textContent = 'Thinking…'; $('sources').innerHTML = '';
  const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})});
  const j = await r.json(); $('askBtn').disabled = false;
  if (!r.ok) { $('answer').textContent = 'Error: ' + j.detail; return; }
  $('answer').textContent = j.answer;
  $('sources').innerHTML = j.sources.length ? `<details open><summary>${j.sources.length} retrieved passages</summary>` +
    j.sources.map(s => `<div class="hit"><b>${esc(s.source)}</b> <span class="meta">p.${s.page} · score ${s.score}</span><br>${esc(s.text)}</div>`).join('') + '</details>' : '';
};
refresh();
</script>
</body>
</html>
